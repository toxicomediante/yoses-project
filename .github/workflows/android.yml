name: Android debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/prepare-android.mjs'
      - 'src/**'
      - 'public/app-icon.png'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project
        run: npm run android:prepare

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoses-project-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YOSES-PROJECT-debug.apk
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build --target main --prerelease --title "YOSE'S PROJECT · Test build" --notes "APK de pruebas de YOSE'S PROJECT. Esta release se actualiza con la última compilación Android válida."
          fi
          gh release upload test-build YOSES-PROJECT-debug.apk --clobber

      - name: Publish APK to GitHub Pages
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/YOSES-PROJECT-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/YOSES-PROJECT-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Android test APK"
            git push origin HEAD:main
          fi
