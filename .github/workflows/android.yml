name: Android debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/prepare-android.mjs'
      - 'src/**'
      - 'public/app-icon.png'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Remove generated APKs from web assets
        run: rm -f public/downloads/*.apk

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project
        run: npm run android:prepare

      - name: Guard against recursive APK bundling
        run: |
          if find dist -type f -name '*.apk' | grep -q .; then
            echo "ERROR: an APK was copied into dist and would be bundled inside the next APK."
            find dist -type f -name '*.apk' -print
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoses-project-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YOSES-PROJECT-debug.apk
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build --target main --prerelease --title "YOSE'S PROJECT · Test build" --notes "APK de pruebas de YOSE'S PROJECT. Esta release se actualiza con la última compilación Android válida."
          fi
          gh release upload test-build YOSES-PROJECT-debug.apk --clobber

