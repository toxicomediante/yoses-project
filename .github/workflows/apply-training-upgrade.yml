name: Apply training upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply training source upgrade
        run: node scripts/apply-training-upgrade.mjs
      - name: Commit upgraded source
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/styles.css
          git commit -m "feat: expand strength catalog and add RIR tracking"
          git push origin HEAD:main
